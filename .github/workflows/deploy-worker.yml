name: Deploy storage worker to Cloudflare

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Check configuration
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Missing the FIREBASE_PROJECT_ID repository variable (Settings -> Secrets and variables -> Actions). See SETUP.md part 3."
            exit 1
          fi
      - run: npx wrangler deploy --var "FIREBASE_PROJECT_ID:$FIREBASE_PROJECT_ID"
        env:
          # Set these under Settings -> Secrets and variables -> Actions -> Secrets.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
